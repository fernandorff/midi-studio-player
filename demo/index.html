<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIDI Studio Player</title>
    <!-- fonts load in the document: @font-face inside a shadow root is ignored -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Source+Serif+4:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap"
    />
    <style>
      body {
        margin: 0;
        background: #eaf0f5;
        color: #111827;
        font:
          16px/1.4 'Source Serif 4',
          Georgia,
          serif;
      }
      body:has(dt-music-app[theme='dark']) {
        background: #0f1719;
        color: #e8eef2;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: #1b494d;
        color: #ffffff;
      }
      h1 {
        margin: 0;
        font:
          700 24px 'Barlow Condensed',
          sans-serif;
        text-transform: uppercase;
      }
      header label {
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }
      select {
        font: inherit;
      }
      footer {
        padding: 8px 16px 24px;
      }
    </style>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header>
      <h1>MIDI Studio Player</h1>
      <span>
        <label
          >Tema
          <select id="theme">
            <option value="field">field</option>
            <option value="dark">dark</option>
          </select></label
        >
        <label
          >Idioma
          <select id="lang">
            <option value="pt">Português</option>
            <option value="en">English</option>
          </select></label
        >
      </span>
    </header>
    <dt-music-app src="./catalog.json"></dt-music-app>
    <footer>
      Renders: FluidR3 (MIT, Frank Wen) e GeneralUser GS v2.0.3 (GeneralUser GS License v2.0, S. Christian Collins).
      Composições do projeto Dungeon Tactics.
    </footer>
  </body>
</html>
